name: UI tests

on:
  push:
    branches: main
  pull_request:
    branches: '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jupyterlab:
    # Run the JupyterLab integration tests against multiple JupyterLab versions
    # and against both chat transports (collaborative/RTC and RTC-free).
    #
    #   * Collaboration jobs install jupyter_collaboration and run the full
    #     suite (including @collaborative-tagged tests).
    #   * RTC-free jobs do NOT install jupyter_collaboration (it is an optional
    #     dependency), so the chat runs over the WebSocket transport. They skip
    #     the RTC-only tests with `--grep-invert @collaborative`.
    #
    # jupyter_collaboration and Galata are version-locked to JupyterLab:
    #   - Galata 5.5.x targets JupyterLab 4.5, Galata 5.6.x targets JupyterLab 4.6.
    #   - jupyter_collaboration 5.x pairs with JupyterLab >= 4.6 (jupyter_ydoc v4);
    #     the 4.x series pairs with JupyterLab < 4.6.
    #
    # Reference snapshots are only maintained for the latest JupyterLab line
    # (>=4.6). Older lines set JLAB_IGNORE_SNAPSHOTS so their run still exercises
    # functional behaviour but skips screenshot comparisons. The RTC-free UI is
    # pixel-identical to the collaborative UI, so the >=4.6 RTC-free job reuses
    # the same reference snapshots (see ui-tests/playwright.config.js).
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Collaborative (RTC) jobs: jupyter_collaboration installed ---
          - name: 'JupyterLab >=4.6 + Collaboration v5'
            jupyterlab: '>=4.6,<4.7'
            collaboration: '>=5,<6'
            galata: '^5.6.0'
            # Latest line owns the reference snapshots, so comparisons run.
            ignore_snapshots: ''
            grep_invert: ''
          - name: 'JupyterLab <4.6 + Collaboration v4'
            jupyterlab: '>=4.2,<4.6'
            collaboration: '~=4.0'
            galata: '~5.5.10'
            # No version-specific snapshots for this line; skip comparisons.
            ignore_snapshots: '1'
            grep_invert: ''
          # --- RTC-free jobs: jupyter_collaboration NOT installed ---
          - name: 'JupyterLab >=4.6'
            jupyterlab: '>=4.6,<4.7'
            collaboration: ''
            galata: '^5.6.0'
            # Reuses the latest-line reference snapshots (identical UI).
            ignore_snapshots: ''
            grep_invert: '@collaborative'
          - name: 'JupyterLab <4.6'
            jupyterlab: '>=4.2,<4.6'
            collaboration: ''
            galata: '~5.5.10'
            ignore_snapshots: '1'
            grep_invert: '@collaborative'

    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

      - name: Install the extension
        run: |
          set -eux
          python ./scripts/dev_install.py

      - name: Pin JupyterLab for this matrix entry
        run: |
          set -eux
          python -m pip install "jupyterlab${{ matrix.jupyterlab }}"

      - name: Install jupyter_collaboration (collaborative jobs only)
        if: matrix.collaboration != ''
        run: |
          set -eux
          python -m pip install "jupyter_collaboration${{ matrix.collaboration }}"

      - name: Show installed extensions
        run: |
          set -eux
          jupyter labextension list
          jupyter server extension list

      - name: Pin Galata for this matrix entry
        working-directory: ui-tests
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 0
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: jlpm add --dev "@jupyterlab/galata@${{ matrix.galata }}"

      - name: Install tests dependencies
        working-directory: ui-tests
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 0
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: jlpm install

      - name: Set up browser cache
        uses: actions/cache@v3
        with:
          path: |
            ${{ github.workspace }}/pw-browsers
          key: ${{ runner.os }}-${{ hashFiles('ui-tests/yarn.lock') }}

      - name: Install browser
        run: jlpm playwright install chromium --only-shell
        working-directory: ui-tests

      - name: Execute integration tests
        working-directory: ui-tests
        env:
          JLAB_IGNORE_SNAPSHOTS: ${{ matrix.ignore_snapshots }}
        run: |
          set -eux
          if [ -n "${{ matrix.grep_invert }}" ]; then
            jlpm test --retries=2 --grep-invert "${{ matrix.grep_invert }}"
          else
            jlpm test --retries=2
          fi

      - name: Upload Playwright Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-jupyterlab-${{ strategy.job-index }}
          path: |
            ui-tests/test-results
            ui-tests/playwright-report

  notebook:
    name: notebook
    runs-on: ubuntu-latest

    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

      - name: Install the extension
        run: |
          set -eux
          python -m pip install "notebook>=7.0.0,<8"
          python ./scripts/dev_install.py

      - name: Install dependencies
        working-directory: ui-tests
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 0
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: jlpm install

      - name: Set up browser cache
        uses: actions/cache@v3
        with:
          path: |
            ${{ github.workspace }}/pw-browsers
          key: ${{ runner.os }}-${{ hashFiles('ui-tests/yarn.lock') }}

      - name: Install browser
        run: jlpm playwright install chromium --only-shell
        working-directory: ui-tests

      - name: Execute integration tests
        working-directory: ui-tests
        run: |
          jlpm test:notebook --retries=2

      - name: Upload Playwright Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-notebook
          path: |
            ui-tests/test-results
            ui-tests/playwright-report
