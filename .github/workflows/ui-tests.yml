name: UI tests

on:
  push:
    branches: main
  pull_request:
    branches: '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jupyterlab:
    # Run the JupyterLab integration tests against multiple JupyterLab versions
    # to guard against regressions on JupyterLab < 4.6 (see issue #471).
    #
    # jupyter_collaboration and Galata are version-locked to JupyterLab, so each
    # matrix entry pins the compatible combination:
    #   - Galata 5.5.x targets JupyterLab 4.5, Galata 5.6.x targets JupyterLab 4.6.
    #   - jupyter_collaboration 5.0.0a0 is required for JupyterLab >= 4.6
    #     (jupyter_ydoc v4); the 4.x series pairs with JupyterLab < 4.6.
    name: jupyterlab (JupyterLab ${{ matrix.label }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: '>=4.6'
            jupyterlab: '>=4.6,<4.7'
            jupyter_collaboration: '==5.0.0a0'
            galata: '^5.6.0'
            # jupyter_collaboration 5.0.0a0 is a prerelease; --pre is scoped to
            # that install only so JupyterLab stays on a stable release (a bare
            # --pre with "<4.7" would otherwise pull a 4.7 alpha).
            collab_pre: '--pre'
            # Reference snapshots for JupyterLab >=4.6 live at the top level of
            # each *-snapshots directory (empty subdir preserves the existing
            # paths). See snapshotPathTemplate in ui-tests/playwright.config.js.
            snapshot_subdir: ''
          - label: '>=4.2,<4.6'
            jupyterlab: '>=4.2,<4.6'
            jupyter_collaboration: '~=4.0'
            galata: '~5.5.10'
            collab_pre: ''
            # JupyterLab <4.6 renders a few reference snapshots slightly
            # differently, so it keeps its own snapshot subfolder.
            snapshot_subdir: 'jupyterlab-lt-4.6'

    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

      - name: Install the extension
        run: |
          set -eux
          python ./scripts/dev_install.py

      - name: Pin JupyterLab and jupyter_collaboration for this matrix entry
        run: |
          set -eux
          python -m pip install "jupyterlab${{ matrix.jupyterlab }}"
          python -m pip install ${{ matrix.collab_pre }} \
            "jupyter_collaboration${{ matrix.jupyter_collaboration }}"
          jupyter labextension list

      - name: Pin Galata for this matrix entry
        working-directory: ui-tests
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 0
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: jlpm add --dev "@jupyterlab/galata@${{ matrix.galata }}"

      - name: Install tests dependencies
        working-directory: ui-tests
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 0
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: jlpm install

      - name: Set up browser cache
        uses: actions/cache@v3
        with:
          path: |
            ${{ github.workspace }}/pw-browsers
          key: ${{ runner.os }}-${{ hashFiles('ui-tests/yarn.lock') }}

      - name: Install browser
        run: jlpm playwright install chromium --only-shell
        working-directory: ui-tests

      - name: Execute integration tests
        working-directory: ui-tests
        env:
          JLAB_SNAPSHOT_SUBDIR: ${{ matrix.snapshot_subdir }}
        run: |
          jlpm test --retries=2

      - name: Upload Playwright Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-jupyterlab-${{ strategy.job-index }}
          path: |
            ui-tests/test-results
            ui-tests/playwright-report

  notebook:
    name: notebook
    runs-on: ubuntu-latest

    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

      - name: Install the extension
        run: |
          set -eux
          python -m pip install "notebook>=7.0.0,<8"
          python ./scripts/dev_install.py

      - name: Install dependencies
        working-directory: ui-tests
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 0
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: jlpm install

      - name: Set up browser cache
        uses: actions/cache@v3
        with:
          path: |
            ${{ github.workspace }}/pw-browsers
          key: ${{ runner.os }}-${{ hashFiles('ui-tests/yarn.lock') }}

      - name: Install browser
        run: jlpm playwright install chromium --only-shell
        working-directory: ui-tests

      - name: Execute integration tests
        working-directory: ui-tests
        run: |
          jlpm test:notebook --retries=2

      - name: Upload Playwright Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-notebook
          path: |
            ui-tests/test-results
            ui-tests/playwright-report
