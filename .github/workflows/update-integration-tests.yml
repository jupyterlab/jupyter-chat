name: Update Playwright Snapshots

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-snapshots:
    runs-on: ubuntu-latest

    if: github.event.issue.pull_request && contains(github.event.comment.body, 'please update snapshots')

    steps:
      - uses: jupyterlab/maintainer-tools/.github/actions/update-snapshots-checkout@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

      - name: Install extension
        run: python ./scripts/dev_install.py

      - name: Pin JupyterLab and jupyter_collaboration
        # Snapshots are only maintained for the latest JupyterLab line, so this
        # mirrors the '>=4.6' entry of the UI tests matrix
        # (.github/workflows/ui-tests.yml).
        run: |
          set -eux
          python -m pip install "jupyterlab>=4.6,<4.7"
          python -m pip install "jupyter_collaboration>=5,<6"

      - name: Pin Galata
        working-directory: ui-tests
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 0
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: jlpm add --dev "@jupyterlab/galata@^5.6.0"

      - uses: jupyterlab/maintainer-tools/.github/actions/update-snapshots@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Playwright knows how to start JupyterLab server
          start_server_script: 'null'
          test_folder: ui-tests
